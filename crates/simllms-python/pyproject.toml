[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "simllms"
# The Authoritative Version is the root workspace manifest; this copy derives
# through the binding crate's Cargo.toml, which the build backend reads.
dynamic = ["version"]
description = "Unified client for multiple LLM providers"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.maturin]
python-source = "python"
module-name = "simllms._core"
bindings = "pyo3"
