[package]
name = "simllms"
description = "Unified client for multiple LLM providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io renders one file, and the repository's default README is the Chinese
# one, so the English copy is what a registry page shows.
readme = "README.en.md"
# Five keywords is crates.io's ceiling, and each is at most twenty characters, so
# this side picks; PyPI has no cap and names every provider in pyproject.toml.
keywords = ["llm", "openai-compatible", "deepseek", "moonshot", "qwen"]
# A published crate states what it carries, so packing the wrong thing goes red
# instead of letting extra files out. `include` cannot reach above the crate
# directory, which is why the licenses, the attribution, the changelog and the
# English README are copies that `cargo xtask sync-package` writes.
# The sources are named as files, not as directories: a bare `src` is a recursive
# grab that never consults `.gitignore`, so an ignored neighbour of the sources
# would be published with them.
include = [
    "src/*.rs",
    "examples/*.rs",
    "README.en.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "THIRD-PARTY-NOTICES.md",
]

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "stream"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "time", "macros"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
mockito = "1"

[features]
default = []
tracing = ["dep:tracing"]
