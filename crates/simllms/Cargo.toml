[package]
name = "simllms"
description = "Unified client for multiple LLM providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "stream"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "time", "macros"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
mockito = "1"

[features]
default = []
tracing = ["dep:tracing"]
