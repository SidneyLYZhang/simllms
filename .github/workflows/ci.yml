name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # Workspace tests are hermetic: no live-provider calls, no network,
        # no Python toolchain. Live smoke lives in examples/ (env-gated,
        # manual only) and never runs here.
        run: cargo test --workspace
      - name: Generated catalog is in sync
        run: cargo xtask refresh-catalog --check
      - name: Authoritative Version is derived everywhere
        run: cargo xtask sync-version --check
      - name: Packed crate carries exactly what its manifest promises
        # Without stdin this checks the derived package copies and both
        # manifests; piping the listing also proves the archive's inventory,
        # which is the thing crates.io would render badly.
        run: |
          cargo package --list --offline --allow-dirty -p simllms \
            | cargo xtask check-package --crate-listing -
      - name: Rust-only entry-point list matches the bindings
        # The guide's list is derived from client.rs minus lib.rs, so binding a
        # method without editing the guide, or renaming one, goes red here.
        run: cargo xtask check-docs
      - name: The release line describes itself truthfully
        # Checked on every pull request, not only when a tag exists: the release
        # workflow is configuration, and configuration goes stale in a merge.
        run: cargo xtask check-workflow

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build and install bindings
        working-directory: crates/simllms-python
        run: |
          uv venv
          uv pip install -e . pytest mypy maturin
      - name: Pack the crate
        run: cargo package --no-verify --allow-dirty -p simllms
      - name: Build the wheel and sdist
        working-directory: crates/simllms-python
        run: |
          uv run --no-sync maturin build --out target/artifacts
          uv run --no-sync maturin sdist --out target/artifacts
      - name: Name the artifacts for the inventory checks
        # An unset variable lets those checks skip, and a green run that skipped
        # is not proof of anything. `realpath` fails on a glob that matched
        # nothing, so a drifted output path goes red here instead.
        run: |
          echo "SIMLLMS_CRATE=$(realpath target/package/simllms-*.crate)" >> "$GITHUB_ENV"
          echo "SIMLLMS_WHEEL=$(realpath crates/simllms-python/target/artifacts/*.whl)" >> "$GITHUB_ENV"
          echo "SIMLLMS_SDIST=$(realpath crates/simllms-python/target/artifacts/simllms-*.tar.gz)" >> "$GITHUB_ENV"
      - name: pytest
        working-directory: crates/simllms-python
        run: uv run --no-sync pytest tests
      - name: mypy (pure-Python layer)
        working-directory: crates/simllms-python
        run: |
          uv run --no-sync mypy python/simllms tests/test_client.py \
            tests/test_capabilities.py tests/test_typing_surface.py \
            tests/test_package_inventory.py tests/test_release_artifacts.py
